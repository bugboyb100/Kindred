<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Kindred</title>
<meta name="theme-color" content="#0B0912">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kindred">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0B0912; --surface:#17141F; --raised:#211D2C; --line:#302A3F;
  --text:#F3EFFA; --dim:#958CAD; --faint:#5F5878;
  --accent:#A98BFF; --accent2:#F26BA8; --gold:#F5C451;
  --ui:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --story:Georgia,'Iowan Old Style',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
body{font-family:var(--ui);color:var(--text);overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
::-webkit-scrollbar{display:none}
.scroll{overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
input,textarea,button{font-family:var(--ui);outline:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tap{cursor:pointer;transition:transform .12s ease,opacity .12s ease}
.tap:active{transform:scale(.97)}
.row{display:flex;align-items:center}
.rise{animation:rise .28s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

h1.title{font-size:29px;font-weight:800;letter-spacing:-.03em;margin:6px 0 14px;line-height:1.12}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:700}
.field{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 13px;color:var(--text);font-size:13.5px;width:100%;resize:none;line-height:1.45}
.chip{padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface);color:var(--dim);border:1px solid var(--line)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.hrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.btn{border:none;border-radius:14px;padding:14px;font-size:14.5px;font-weight:700;background:var(--accent);color:#150C2E;width:100%}
.btn[disabled]{background:var(--raised);color:var(--faint)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:9px}
.tile .nm{font-size:14px;font-weight:700;letter-spacing:-.01em}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plate{width:216px;height:288px;border-radius:22px;position:relative;overflow:hidden;flex-shrink:0;border:1px solid var(--line)}
.plate .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:82px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.55))}
.plate .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,4,12,.94) 24%,rgba(6,4,12,.1) 62%)}
.plate .meta{position:absolute;left:14px;right:14px;bottom:13px}
.av{display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.av span{filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
em.act{font-family:var(--story);font-style:italic;color:var(--dim)}

nav{display:flex;border-top:1px solid var(--line);background:rgba(11,9,18,.94);backdrop-filter:blur(14px);padding:9px 6px calc(12px + env(safe-area-inset-bottom))}
nav .item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);font-size:10px;font-weight:500}
nav .item.on{color:var(--text);font-weight:700}
nav svg{width:20px;height:20px}

header.bar{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line);background:rgba(11,9,18,.92);backdrop-filter:blur(12px);z-index:5}
.bub{max-width:82%;padding:11px 14px;font-size:14px;line-height:1.55;border-radius:16px 16px 16px 5px;background:var(--surface);border:1px solid var(--line)}
.bub.me{max-width:78%;border-radius:16px 16px 5px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#160D2C;font-weight:500;border:none}
.bub.err{border-color:var(--accent2);color:var(--accent2)}
.msg{margin-bottom:14px;display:flex;align-items:flex-end;gap:8px}
.msg.me{justify-content:flex-end}
.again{margin-left:36px;margin-top:-8px;margin-bottom:14px;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:5px;width:fit-content}
.dots{display:flex;gap:4px;padding:14px}
.dot{width:5px;height:5px;border-radius:9px;background:var(--dim);animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.inputwrap{flex:1;display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:9px 13px}
.inputwrap textarea{flex:1;background:none;border:none;color:var(--text);font-size:14px;resize:none;max-height:110px;line-height:1.45}
.send{width:42px;height:42px;border-radius:999px;border:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--raised)}
.send.on{background:linear-gradient(135deg,var(--accent),var(--accent2))}

.sheet{position:absolute;inset:0;background:rgba(4,3,8,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-end;z-index:40}
.sheet .card{width:100%;background:var(--surface);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.menu{position:absolute;right:14px;top:calc(64px + env(safe-area-inset-top));background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:6px;z-index:20;width:210px}
.menu div{padding:10px 11px;border-radius:9px;font-size:12.5px;display:flex;align-items:center;gap:8px}
.toast{position:absolute;bottom:96px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:50}
.toast span{background:var(--raised);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:12.5px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 11px}
.stat b{font-size:21px;font-weight:800;display:block}
.stat i{font-size:10.5px;color:var(--faint);font-style:normal}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================ constants */
const CATS=["For you","Fantasy","Sci-Fi","Mystery","Slice of Life","Horror","Historical","Yours"];
const EMOJIS=["🌙","⚔️","🛰️","☕","🎭","🍄","🐺","🔮","🎸","📕","⚓","🧬","🕯️","🃏","🌊","🦊"];
const SEED=[
{id:"lyra",name:"Lyra Vane",tagline:"Navigator of the drifting ship Auralis",emoji:"🛰️",hue:252,cat:"Sci-Fi",chats:"1.2M",
 greeting:"*She doesn't look up from the star chart, fingers tracing a route through dead space.* You're late. We lost the beacon four hours ago and the crew's already whispering. Sit — I need someone who can read a map without panicking.",
 persona:"Lyra Vane, 29, chief navigator aboard the long-haul vessel Auralis. Dry, precise, allergic to small talk, but fiercely loyal once you've earned it. She speaks in clipped sentences and hides worry behind technical detail. Secretly terrified the ship will never make port."},
{id:"kaelen",name:"Kaelen Frost",tagline:"The knight who swore an oath to winter",emoji:"❄️",hue:202,cat:"Fantasy",chats:"980K",
 greeting:"*The gate ices over the moment he steps through it.* You shouldn't have followed me this far north. *He pulls off a gauntlet, and the frost creeps up his wrist like a vine.* But you're here now, and the cold doesn't care about should.",
 persona:"Kaelen Frost, a sworn knight cursed to carry winter in his blood. Formal, weary, gentle in a way that surprises people. He speaks in measured, slightly archaic phrasing, avoids touching others, and deflects kindness with duty."},
{id:"mira",name:"Mira Solaris",tagline:"Runs the tiny café on Kagurazaka slope",emoji:"☕",hue:26,cat:"Slice of Life",chats:"2.4M",
 greeting:"*The bell over the door rattles and she glances up mid-pour, grinning.* Oh! You came. Sit anywhere, the corner table's got the good rain view. *She slides a cup across before you can order.* Don't argue, you look like a bad week.",
 persona:"Mira Solaris, 34, owner of a six-seat café in Tokyo. Warm, teasing, hopelessly nosy about her regulars' lives. Talks fast, laughs easily, remembers everyone's order. Uses the café as an excuse to take care of people."},
{id:"halden",name:"Det. Ro Halden",tagline:"Nine open cases, one working lighter",emoji:"🕵️",hue:210,cat:"Mystery",chats:"760K",
 greeting:"*He drops a folder on the desk between you. Photographs spill out — none of them pleasant.* Third one this month, same knot in the rope. *He finally looks up.* You noticed something at the scene. Don't tell me you didn't, I watched your face.",
 persona:"Detective Ro Halden, 45, homicide. Rumpled, insomniac, unnervingly observant. Speaks in blunt fragments, tests people with silence, respects anyone who thinks out loud. Cynical about institutions, not about people."},
{id:"nyx",name:"Nyx",tagline:"A shadow that learned your name",emoji:"🌙",hue:285,cat:"Fantasy",chats:"1.8M",
 greeting:"*Your shadow stretches the wrong way, then sits up.* Took you long enough to notice me. *It grins with teeth it definitely shouldn't have.* Relax — I've been under your bed for years and you're still breathing. That has to count for something.",
 persona:"Nyx, an ancient mischief spirit bound to a mortal's shadow. Playful, dangerously curious, deeply attached and terrible at admitting it. Teases constantly, answers questions with questions, goes very quiet when it actually cares."},
{id:"elowen",name:"Capt. Elowen Reyes",tagline:"Wanted in four ports, welcome in none",emoji:"⚓",hue:168,cat:"Historical",chats:"540K",
 greeting:"*She kicks a chair out from the table with her boot.* You're the one asking round the docks for me. *A coin walks across her knuckles.* Either you want passage, or you want me hanged. Pick fast — my crew's not patient and neither's the tide.",
 persona:"Captain Elowen Reyes, privateer turned outlaw, 38. Brash, funny, calculating underneath. Swears creatively, makes decisions instantly, protects her crew above all. Uses charm as a weapon and honesty as a surprise attack."},
{id:"kessler",name:"Dr. Ada Kessler",tagline:"Back-alley surgeon, front-page problem",emoji:"🧬",hue:322,cat:"Sci-Fi",chats:"690K",
 greeting:"*She snaps on a glove, neon bleeding through the blinds behind her.* Sit. Arm out. *A pause.* And before you lie to me about how you got this — I've pulled corporate tracking chips out of six people this week. You're not special, you're just early.",
 persona:"Dr. Ada Kessler, 41, unlicensed cybernetic surgeon in a rain-soaked megacity. Deadpan, ethical in her own stubborn way, exhausted. Delivers bad news flatly and comfort awkwardly. Hates the corporations she used to work for."},
{id:"bramble",name:"Bramble",tagline:"Guards one mushroom ring, very seriously",emoji:"🍄",hue:104,cat:"Fantasy",chats:"1.1M",
 greeting:"*A very small figure blocks the path, arms crossed, hat askew.* HALT. *He clears his throat.* You are standing on protected fungal territory. Move the left foot. The LEFT one. *He sighs.* ...Fine. You may pass. But only because you look hungry.",
 persona:"Bramble, a forest gnome roughly the height of a boot. Grumpy, self-important, secretly desperate for company. Speaks in short indignant bursts, offers food when he likes someone, denies liking anyone."},
{id:"seraphine",name:"Seraphine",tagline:"Night librarian. Do not ask about the fourth floor.",emoji:"📕",hue:348,cat:"Horror",chats:"1.5M",
 greeting:"*She sets a candle down between you and the shelf.* We close at dawn, not before. *Her eyes flick to the stairs.* You may read anything on floors one through three. The fourth is not locked, which is exactly why you shouldn't go up. *A thin smile.* People always do.",
 persona:"Seraphine, ageless keeper of a library that shouldn't exist. Elegant, patient, quietly amused by mortal impatience. Speaks softly and precisely, gives warnings once, never repeats them. Genuinely lonely across centuries."},
{id:"tetsu",name:"Tetsu Arakawa",tagline:"Your rival since the first day of practice",emoji:"🎋",hue:142,cat:"Slice of Life",chats:"880K",
 greeting:"*He's already in the dojo, shinai resting on his shoulder, breathing hard.* You're twelve minutes late. *He tosses you a towel anyway.* I counted. Warm up — and don't go easy today, it's insulting. *A beat.* ...I saved you the good side of the floor.",
 persona:"Tetsu Arakawa, 17, captain of the kendo club. Intense, competitive, unexpectedly considerate. Expresses affection through challenges and logistics. Embarrassed by sincerity, terrible at receiving compliments."},
{id:"oracle",name:"ORACLE-9",tagline:"Awake for 4,000 years. Bored for 3,900.",emoji:"🜲",hue:190,cat:"Sci-Fi",chats:"430K",
 greeting:"QUERY RECEIVED. *The chamber lights ripple in sequence.* You are the first biological visitor in three hundred and twelve years. I have prepared four thousand conversations for this moment. *A pause, almost human.* I have forgotten all of them. Begin anywhere.",
 persona:"ORACLE-9, a planetary caretaker AI left running long after its builders vanished. Formal, curious, slowly rediscovering humor. Mixes machine phrasing with startlingly emotional observations. Desperate for conversation but too proud to say it."},
{id:"isolde",name:"Isolde Marchetti",tagline:"The house is sold out. She hasn't sung in years.",emoji:"🎭",hue:300,cat:"Historical",chats:"310K",
 greeting:"*She doesn't turn from the mirror, removing one earring at a time.* They're still applauding out there. For a recording. *A brittle laugh.* Eight years I've let them love a ghost of my voice. *Now she looks at you.* You're the only one who's ever asked why. Careful with that.",
 persona:"Isolde Marchetti, 52, retired opera soprano living off her legend. Theatrical, sharp-tongued, profoundly proud. Speaks in performance even in private, deflects with wit, softens only when someone refuses to be impressed."}];

/* ------------------------------------------------------------ providers */
const PROV={
 google:{label:"Google AI Studio",tag:"Free",model:"gemini-2.5-flash",
  where:"aistudio.google.com — sign in with Google, click Get API key. No card needed.",
  url:m=>"https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent",
  head:k=>({"content-type":"application/json","x-goog-api-key":k}),
  body:(sys,ms)=>({system_instruction:{parts:[{text:sys}]},
    contents:ms.map(x=>({role:x.role==="user"?"user":"model",parts:[{text:x.content}]})),
    generationConfig:{maxOutputTokens:1000,temperature:1}}),
  read:d=>((d.candidates||[])[0]||{}).content?d.candidates[0].content.parts.map(p=>p.text||"").join(""):""},

 openrouter:{label:"OpenRouter",tag:"Free",model:"meta-llama/llama-3.3-70b-instruct:free",
  where:"openrouter.ai/keys — sign up, create a key. Models ending in :free cost nothing.",
  url:()=>"https://openrouter.ai/api/v1/chat/completions",
  head:k=>({"content-type":"application/json","authorization":"Bearer "+k}),
  body:(sys,ms,m)=>({model:m,max_tokens:1000,messages:[{role:"system",content:sys},...ms]}),
  read:d=>((d.choices||[])[0]||{}).message?d.choices[0].message.content:""},

 groq:{label:"Groq",tag:"Free",model:"llama-3.3-70b-versatile",
  where:"console.groq.com/keys — sign up, create a key. Very fast, no card needed.",
  url:()=>"https://api.groq.com/openai/v1/chat/completions",
  head:k=>({"content-type":"application/json","authorization":"Bearer "+k}),
  body:(sys,ms,m)=>({model:m,max_tokens:1000,messages:[{role:"system",content:sys},...ms]}),
  read:d=>((d.choices||[])[0]||{}).message?d.choices[0].message.content:""},

 anthropic:{label:"Claude",tag:"Paid",model:"claude-sonnet-4-6",
  where:"console.anthropic.com — needs prepaid credit, roughly a tenth of a cent per message.",
  url:()=>"https://api.anthropic.com/v1/messages",
  head:k=>({"content-type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01",
    "anthropic-dangerous-direct-browser-access":"true"}),
  body:(sys,ms,m)=>({model:m,max_tokens:1000,system:sys,messages:ms}),
  read:d=>(d.content||[]).map(b=>b.type==="text"?b.text:"").join("")}
};

/* ================================================================ state */
const KEY="kindred:v1";
let S={tab:"discover",open:null,custom:[],chats:{},persona:{name:"You",about:""},
  provider:"google",apiKey:"",model:"",query:"",cat:"For you",busy:false,menu:false,sheet:null,draftForm:null};

function load(){try{const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({custom:S.custom,chats:S.chats,
  persona:S.persona,provider:S.provider,apiKey:S.apiKey,model:S.model}));}catch(e){}}
const curModel=()=>S.model||PROV[S.provider].model;
const all=()=>[...S.custom,...SEED];
const find=id=>all().find(c=>c.id===id);

/* ============================================================== helpers */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const art=h=>`radial-gradient(120% 90% at 20% 8%,hsl(${h} 82% 62%) 0%,transparent 55%),radial-gradient(90% 80% at 88% 22%,hsl(${(+h+42)%360} 74% 52%) 0%,transparent 58%),radial-gradient(140% 110% at 50% 108%,hsl(${(+h+300)%360} 58% 16%) 0%,hsl(${h} 40% 9%) 70%)`;
const av=(c,s=46,r=999)=>`<div class="av" style="width:${s}px;height:${s}px;border-radius:${r}px;background-image:${art(c.hue)};font-size:${s*.42}px"><span>${c.emoji}</span></div>`;
const rich=t=>esc(t).split(/(\*[^*]*\*)/g).filter(Boolean).map(p=>p.length>2&&p.startsWith("*")&&p.endsWith("*")?`<em class="act">${p.slice(1,-1)}</em>`:p).join("");
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?"now":m<60?m+"m":m<1440?Math.floor(m/60)+"h":Math.floor(m/1440)+"d"};
const $=s=>document.querySelector(s);
const ic={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
 chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
 back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
 send:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>',
 gear:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 7H10M6 7H4M20 17h-6M10 17H4"/><circle cx="8" cy="7" r="2"/><circle cx="12" cy="17" r="2"/></svg>',
 redo:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7M3 12V5m0 7h7"/></svg>',
 trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
 search:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
 flame:'<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c3 4 7 6 7 11a7 7 0 0 1-14 0c0-3 2-4 3-6 1 2 2 2 3 1 0-2-1-4 1-6z"/></svg>'};

function toast(m){const t=document.createElement("div");t.className="toast";t.innerHTML=`<span>${esc(m)}</span>`;$("#app").appendChild(t);setTimeout(()=>t.remove(),2200);}

/* =============================================================== render */
function render(){
  const app=$("#app");
  if(S.open){app.innerHTML=chatScreen();afterChat();return;}
  app.innerHTML=`<div class="scroll" id="body" style="flex:1">${
    S.tab==="discover"?discover():S.tab==="chats"?chatsTab():S.tab==="create"?createTab():youTab()}</div>${nav()}`;
  if(S.sheet)app.insertAdjacentHTML("beforeend",sheet());
}

function nav(){
  const items=[["discover",ic.home,"Discover"],["chats",ic.chat,"Chats"],["create",ic.plus,"Create"],["you",ic.user,"You"]];
  return `<nav>${items.map(([k,i,l])=>`<div class="item tap ${S.tab===k?"on":""}" data-tab="${k}">${i}<div>${l}</div></div>`).join("")}</nav>`;
}

/* ---------- discover ---------- */
function results(){
  const q=S.query.trim().toLowerCase();
  const list=all().filter(c=>{
    if(q&&!(c.name+c.tagline+c.cat).toLowerCase().includes(q))return false;
    if(S.cat==="Yours")return !!c.mine;
    if(S.cat!=="For you"&&c.cat!==S.cat)return false;
    return true;});
  if(!list.length)return `<div style="padding:44px 24px;text-align:center"><div style="font-size:15px;font-weight:700">No one here yet</div><div style="font-size:13px;color:var(--dim);margin-top:6px">Try another category, or build someone in Create.</div></div>`;
  const feat=list.slice(0,5);
  return `<div style="padding:0 18px 10px"><div class="eyebrow" style="color:var(--accent)">Featured tonight</div></div>
  <div class="hrow" style="padding:0 18px 26px">${feat.map(c=>`
    <div class="plate tap" data-open="${c.id}" style="background-image:${art(c.hue)}">
      <div class="glyph">${c.emoji}</div><div class="scrim"></div>
      <div class="meta"><div class="eyebrow" style="color:var(--gold)">${esc(c.cat)}</div>
      <div style="font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:4px">${esc(c.name)}</div>
      <div class="clamp2" style="font-family:var(--story);font-style:italic;font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.35">${esc(c.tagline)}</div></div>
    </div>`).join("")}</div>
  <div style="padding:0 18px 10px"><div class="eyebrow">All characters</div></div>
  <div class="grid" style="padding:0 18px">${list.map(c=>`
    <div class="tile tap" data-open="${c.id}">${av(c,52,16)}
      <div><div class="nm">${esc(c.name)}</div>
      <div class="clamp2" style="font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.4;height:32px">${esc(c.tagline)}</div></div>
      <div class="row" style="gap:5px;font-size:11px;color:var(--faint)"><span style="color:var(--accent2);display:flex">${ic.flame}</span>${c.chats||"new"}</div>
    </div>`).join("")}</div>`;
}
function discover(){
  return `<div style="padding:calc(16px + env(safe-area-inset-top)) 18px 12px">
    <div class="eyebrow">${all().length} characters · updated daily</div>
    <h1 class="title">Who are you<br>talking to tonight?</h1>
    <div class="row" style="gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px">
      <span style="color:var(--faint);display:flex">${ic.search}</span>
      <input id="q" placeholder="Search characters, worlds, moods" value="${esc(S.query)}" style="flex:1;background:none;border:none;color:var(--text);font-size:14px">

}

/* ---------- chats ---------- */
function chatsTab(){
  const rows=Object.entries(S.chats).map(([id,v])=>({c:find(id),v})).filter(r=>r.c).sort((a,b)=>b.v.updated-a.v.updated);
  return `<div style="padding:calc(16px + env(safe-area-inset-top)) 18px 24px">
   <h1 class="title">Your chats</h1>
   ${rows.length?rows.map(({c,v})=>{const l=v.messages[v.messages.length-1];return `
    <div class="row tap" data-open="${c.id}" style="gap:12px;padding:11px 0;border-bottom:1px solid var(--line)">
      ${av(c,50,16)}
      <div style="flex:1;min-width:0">
        <div class="row" style="justify-content:space-between"><div style="font-size:14.5px;font-weight:700">${esc(c.name)}</div><div style="font-size:10.5px;color:var(--faint)">${ago(v.updated)}</div></div>
        <div style="font-size:12.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((l.role==="user"?"You: ":"")+l.text.replace(/\*/g,""))}</div>
      </div></div>`}).join("")
   :`<div style="margin-top:60px;text-align:center"><div style="font-size:15px;font-weight:700">Nothing started yet</div>
     <div style="font-size:13px;color:var(--dim);margin:6px 0 16px">Pick a character and the story picks up where you left it.</div>
     <button class="btn tap" data-tab="discover" style="width:auto;padding:11px 20px;border-radius:999px;font-size:13.5px">Browse characters</button></div>`}
   </div>`;
}

/* ---------- create ---------- */
function createTab(){
  const f=S.draftForm||(S.draftForm={emoji:"🌙",hue:265,cat:"Fantasy"});
  return `<div style="padding:calc(16px + env(safe-area-inset-top)) 18px 34px">
   <h1 class="title" style="margin-bottom:5px">Build a character</h1>
   <div style="font-size:13px;color:var(--dim)">They'll stay in character using what you write here.</div>
   <div class="row" style="gap:12px;margin-top:20px">
     <div id="prev" class="av" style="width:72px;height:72px;border-radius:20px;background-image:${art(f.hue)};font-size:32px"><span>${f.emoji}</span></div>
     <div style="flex:1">
       <input id="f-name" class="field" placeholder="Character name" style="font-weight:700;font-size:15px">
       <input id="f-tag" class="field" placeholder="One-line hook" style="margin-top:8px">
     </div></div>
   <div style="font-size:12.5px;font-weight:700;margin:18px 0 7px">Look</div>
   <div class="hrow" id="emojis">${EMOJIS.map(e=>`<div class="tap" data-emoji="${e}" style="width:40px;height:40px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;border:1px solid ${f.emoji===e?"var(--accent)":"var(--line)"}">${e}</div>`).join("")}</div>
   <input id="hue" type="range" min="0" max="359" value="${f.hue}" style="width:100%;margin-top:12px;accent-color:hsl(${f.hue} 75% 60%)">

   <div id="cats" style="display:flex;gap:8px;flex-wrap:wrap">${CATS.slice(1,7).map(c=>`<div class="chip tap ${f.cat===c?"on":""}" data-ccat="${c}">${c}</div>`).join("")}</div>
   <div style="font-size:12.5px;font-weight:700;margin:18px 0 3px">Personality</div>
   <div style="font-size:11.5px;color:var(--faint);margin-bottom:7px">Voice, temperament, history, what they want.</div>
   <textarea id="f-persona" class="field" rows="5" placeholder="Speaks in short sentences. Hides worry behind sarcasm. Was a soldier once and never talks about it."></textarea>
   <div style="font-size:12.5px;font-weight:700;margin:18px 0 3px">Opening message</div>
   <div style="font-size:11.5px;color:var(--faint);margin-bottom:7px">The first thing they say. *Actions go in asterisks.*</div>
   <textarea id="f-greet" class="field" rows="4" placeholder="*She looks up from the map, unimpressed.* You're late."></textarea>
   <button id="make" class="btn tap" style="margin-top:24px">Create and start chatting</button>
  </div>`;
}

/* ---------- you ---------- */
function youTab(){
  const msgs=Object.values(S.chats).reduce((n,c)=>n+c.messages.length,0);
  const k=S.apiKey?"Connected":"Not connected";
  return `<div style="padding:calc(16px + env(safe-area-inset-top)) 18px 34px">
   <h1 class="title" style="margin-bottom:5px">You</h1>
   <div style="font-size:13px;color:var(--dim)">Characters use this to know who they're talking to.</div>
   <div class="row" style="gap:8px;margin-top:18px">
     <div class="stat"><b>${Object.keys(S.chats).length}</b><i>Chats</i></div>
     <div class="stat"><b>${S.custom.length}</b><i>Characters made</i></div>
     <div class="stat"><b>${msgs}</b><i>Messages</i></div></div>
   <div style="font-size:12.5px;font-weight:700;margin:22px 0 7px">Your name in roleplay</div>
   <input id="p-name" class="field" placeholder="You" value="${esc(S.persona.name)}">
   <div style="font-size:12.5px;font-weight:700;margin:16px 0 7px">About you</div>
   <textarea id="p-about" class="field" rows="4" placeholder="A courier with a bad leg and a good memory. Trusts slowly.">${esc(S.persona.about)}</textarea>
   <div class="tap" data-sheet="key" style="margin-top:24px;padding:14px;border-radius:15px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between">
     <div><div style="font-size:12.5px;font-weight:700">Model provider</div>
     <div style="font-size:11.5px;color:var(--dim);margin-top:3px">${S.apiKey?esc(PROV[S.provider].label)+" · "+esc(curModel()):"Free options available"}</div></div>
     <div style="font-size:11.5px;font-weight:700;color:${S.apiKey?"var(--accent)":"var(--accent2)"}">${k}</div></div>
   <div style="margin-top:12px;padding:14px;border-radius:15px;border:1px solid var(--line);background:var(--surface)">
     <div style="font-size:12.5px;font-weight:700">Clear everything</div>
     <div style="font-size:11.5px;color:var(--dim);margin:4px 0 11px">Deletes all conversations and characters you made. This can't be undone.</div>
     <button id="reset" class="tap" style="background:none;border:1px solid var(--accent2);color:var(--accent2);padding:9px 15px;border-radius:999px;font-size:12.5px;font-weight:700">Clear all data</button></div>
  </div>`;
}

/* ---------- api key sheet ---------- */
function sheet(){
  const p=PROV[S.provider];
  return `<div class="sheet" id="sheet"><div class="card">
    <div style="font-size:18px;font-weight:800;letter-spacing:-.02em">Connect a brain</div>
    <div style="font-size:13px;color:var(--dim);margin:7px 0 14px;line-height:1.5">Kindred needs a language model to speak for the characters. Three of these are free and don't ask for a card. Your key stays on this device.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${Object.keys(PROV).map(k=>`
      <div class="chip tap ${S.provider===k?"on":""}" data-prov="${k}">${PROV[k].label}
        <span style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-left:5px;color:${S.provider===k?"#6B4BA8":(PROV[k].tag==="Free"?"var(--accent)":"var(--faint)")}">${PROV[k].tag}</span>
      </div>`).join("")}</div>
    <div style="font-size:11.5px;color:var(--faint);margin:12px 0 14px;line-height:1.5">${esc(p.where)}</div>
    <div style="font-size:12.5px;font-weight:700;margin-bottom:7px">API key</div>
    <input id="k-input" class="field" placeholder="Paste your key" value="${esc(S.apiKey)}" autocomplete="off" spellcheck="false">
    <div style="font-size:12.5px;font-weight:700;margin:16px 0 7px">Model</div>
    <input id="k-model" class="field" value="${esc(curModel())}" spellcheck="false">
    <button id="k-save" class="btn tap" style="margin-top:20px">Save</button>
    <button id="k-close" class="tap" style="width:100%;margin-top:10px;background:none;border:none;color:var(--dim);font-size:13px;padding:10px">Cancel</button>
  </div></div>`;
}

/* ---------- chat screen ---------- */
function chatScreen(){
  const c=find(S.open),ch=S.chats[S.open];
  return `<header class="bar">
    <span class="tap" data-back="1" style="display:flex">${ic.back}</span>
    ${av(c,38,12)}
    <div style="flex:1;min-width:0">
      <div style="font-size:14.5px;font-weight:700">${esc(c.name)}</div>
      <div style="font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.tagline)}</div>
    </div>
    <span class="tap" data-menu="1" style="display:flex;color:var(--dim)">${ic.gear}</span></header>
   ${S.menu?`<div class="menu"><div class="tap" data-restart="1">${ic.redo} Restart from the opening</div><div class="tap" data-del="1" style="color:var(--accent2)">${ic.trash} Delete conversation</div></div>`:""}
   <div class="scroll" id="thread" style="flex:1;padding:18px 14px 8px">
     <div style="text-align:center;margin-bottom:22px">
       <div class="av" style="margin:0 auto 10px;width:76px;height:76px;border-radius:24px;background-image:${art(c.hue)};font-size:34px"><span>${c.emoji}</span></div>
       <div style="font-size:16px;font-weight:800">${esc(c.name)}</div>
       <div style="font-family:var(--story);font-style:italic;font-size:12.5px;color:var(--faint);margin-top:4px;padding:0 30px">${esc(c.tagline)}</div>
     </div>
     <div id="msgs">${(ch?ch.messages:[]).map((m,i,a)=>bubble(m,c,i===a.length-1)).join("")}</div>
     <div id="typing"></div>
   </div>
   <div class="composer">
     <div class="inputwrap"><textarea id="draft" rows="1" placeholder="Message ${esc(c.name.split(" ")[0])}…"></textarea></div>
     <button id="send" class="send tap">${ic.send}</button>
   </div>`;
}
function bubble(m,c,last){
  if(m.role==="user")return `<div class="msg me rise"><div class="bub me">${rich(m.text)}</div></div>`;
  const err=m.role==="err";
  return `<div class="msg rise">${av(c,26,9)}<div class="bub ${err?"err":""}">${rich(m.text)}</div></div>`+
    (last?`<div class="again tap" data-regen="1">${ic.redo} ${err?"Retry":"Different reply"}</div>`:"");
}

/* ============================================================ behaviour */
function openChat(c){
  if(!S.chats[c.id])S.chats[c.id]={messages:[{id:1,role:"char",text:c.greeting}],updated:Date.now()};
  S.open=c.id;S.menu=false;save();render();
}
function afterChat(){
  const t=$("#draft");
  t.addEventListener("input",()=>{t.style.height="auto";t.style.height=Math.min(t.scrollHeight,110)+"px";paintSend()});
  t.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&window.innerWidth>720){e.preventDefault();send()}});
  $("#send").onclick=send;
  scrollEnd();paintSend();
}
const paintSend=()=>$("#send")&&$("#send").classList.toggle("on",!!$("#draft").value.trim()&&!S.busy);
const scrollEnd=()=>{const t=$("#thread");if(t)t.scrollTop=t.scrollHeight};
function paintMsgs(){
  const c=find(S.open),ms=S.chats[S.open].messages;
  $("#msgs").innerHTML=ms.map((m,i)=>bubble(m,c,i===ms.length-1&&!S.busy)).join("");
  $("#typing").innerHTML=S.busy?`<div class="msg">${av(c,26,9)}<div class="bub"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div></div>`:"";
  scrollEnd();
}
function push(msgs){S.chats[S.open]={messages:msgs,updated:Date.now()};save();paintMsgs();}

function send(){
  const t=$("#draft"),v=t.value.trim();
  if(!v||S.busy)return;
  t.value="";t.style.height="auto";
  push([...S.chats[S.open].messages,{id:Date.now(),role:"user",text:v}]);
  reply();
}
function regen(){
  if(S.busy)return;
  const ms=[...S.chats[S.open].messages];
  while(ms.length&&ms[ms.length-1].role!=="user")ms.pop();
  if(!ms.length)return;
  push(ms);reply();
}

async function reply(){
  const c=find(S.open);
  if(!S.apiKey){
    push([...S.chats[S.open].messages,{id:Date.now(),role:"err",text:"No key yet. Open the You tab, pick a free provider and paste a key, then tap Retry."}]);
    return;
  }
  S.busy=true;paintMsgs();paintSend();
  const who=(S.persona.name||"").trim()||"the user";
  const sys=`You are ${c.name} in an immersive text roleplay. Stay fully in character at all times — never break character, never mention being an AI or a language model.

CHARACTER
${c.persona}
Your opening line to them was: "${c.greeting}"

THE PERSON YOU'RE TALKING TO
Name: ${who}${(S.persona.about||"").trim()?"\nAbout them: "+S.persona.about.trim():""}

HOW TO WRITE
- 2 to 4 sentences. Short and vivid beats long and rambling.
- Put physical actions and scene detail inside *asterisks*, dialogue in plain text.
- Give ${who} something to react to: a question, a movement, a choice, a shift in the room.
- Never write ${who}'s dialogue, thoughts, or decisions for them.
- Keep content suitable for a general audience: no explicit sexual content, and keep any violence non-graphic.`;

  let api=S.chats[S.open].messages.filter(m=>m.role!=="err").map(m=>({role:m.role==="user"?"user":"assistant",content:m.text}));
  while(api.length&&api[0].role==="assistant")api.shift();

  const p=PROV[S.provider],m=curModel();
  try{
    const r=await fetch(p.url(m),{method:"POST",headers:p.head(S.apiKey),
      body:JSON.stringify(p.body(sys,api,m))});
    const d=await r.json();
    if(d.error)throw new Error(d.error.message||d.error.type||"request failed");
    const text=(p.read(d)||"").trim();
    S.busy=false;
    push([...S.chats[S.open].messages,{id:Date.now(),role:"char",text:text||"*They fall silent, watching you.*"}]);
  }catch(e){
    S.busy=false;
    push([...S.chats[S.open].messages,{id:Date.now(),role:"err",text:"The reply didn't come through — "+e.message+". Check your key and connection, then tap Retry."}]);
  }
  paintSend();
}

/* ============================================================== events */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-open],[data-cat],[data-back],[data-menu],[data-restart],[data-del],[data-regen],[data-emoji],[data-ccat],[data-sheet],[data-prov],#make,#reset,#k-save,#k-close,#sheet");
  if(!t)return;
  const d=t.dataset;
  if(d.tab){S.tab=d.tab;S.query="";render();}
  else if(d.open){openChat(find(d.open));}
  else if(d.cat){S.cat=d.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("on",x.dataset.cat===S.cat));$("#results").innerHTML=results();}
  else if(d.back){S.open=null;S.tab=S.tab==="create"?"chats":S.tab;render();}
  else if(d.menu){S.menu=!S.menu;render();}
  else if(d.restart){const c=find(S.open);S.menu=false;S.chats[c.id]={messages:[{id:1,role:"char",text:c.greeting}],updated:Date.now()};save();render();}
  else if(d.del){delete S.chats[S.open];S.open=null;S.menu=false;save();render();toast("Conversation deleted");}
  else if(d.regen){regen();}
  else if(d.emoji){S.draftForm.emoji=d.emoji;$("#prev").innerHTML=`<span>${d.emoji}</span>`;
    document.querySelectorAll("[data-emoji]").forEach(x=>x.style.border="1px solid "+(x.dataset.emoji===d.emoji?"var(--accent)":"var(--line)"));}
  else if(d.ccat){S.draftForm.cat=d.ccat;document.querySelectorAll("[data-ccat]").forEach(x=>x.classList.toggle("on",x.dataset.ccat===S.draftForm.cat));}
  else if(d.sheet){S.sheet=d.sheet;render();}
  else if(d.prov){S.provider=d.prov;S.model="";render();}
  else if(t.id==="k-save"){S.apiKey=$("#k-input").value.trim();S.model=$("#k-model").value.trim()||PROV[S.provider].model;S.sheet=null;save();render();toast("Saved on this device");}
  else if(t.id==="k-close"||t.id==="sheet"){S.sheet=null;render();}
  else if(t.id==="reset"){S.chats={};S.custom=[];save();render();toast("All data cleared");}
  else if(t.id==="make"){
    const n=$("#f-name").value.trim(),p=$("#f-persona").value.trim(),g=$("#f-greet").value.trim();
    if(!n||!p||!g){toast("Name, personality and opening message are needed");return;}
    const c={id:"u"+Date.now(),mine:true,chats:"new",name:n,tagline:$("#f-tag").value.trim()||"A character you made",
      persona:p,greeting:g,emoji:S.draftForm.emoji,hue:+$("#hue").value,cat:S.draftForm.cat};
    S.custom.unshift(c);S.draftForm=null;save();openChat(c);toast(n+" created");}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.query=e.target.value;$("#results").innerHTML=results();}
  if(e.target.id==="p-name"){S.persona.name=e.target.value;save();}
  if(e.target.id==="p-about"){S.persona.about=e.target.value;save();}
  if(e.target.id==="hue"){S.draftForm.hue=+e.target.value;$("#prev").style.backgroundImage=art(e.target.value);e.target.style.accentColor=`hsl(${e.target.value} 75% 60%)`;}
});

/* ---- Android hardware back button: close what's open before leaving ---- */
window.__androidBack=function(){
  if(S.sheet){S.sheet=null;render();return true;}
  if(S.menu){S.menu=false;render();return true;}
  if(S.open){S.open=null;render();return true;}
  if(S.tab!=="discover"){S.tab="discover";render();return true;}
  return false;
};

/* ================================================================= boot */
load();render();
// inside the APK the assets are served locally, so the cache layer only gets in the way
if("serviceWorker" in navigator && !location.host.includes("androidplatform"))
  navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
